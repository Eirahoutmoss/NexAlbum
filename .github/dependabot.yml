version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["bağımlılık"]
    ignore:
      # 8.0+ ticari lisans (Karar 08 Rev. 1): 7.x'te kalınır.
      - dependency-name: "FluentAssertions"
        versions: [">= 8.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["bağımlılık"]

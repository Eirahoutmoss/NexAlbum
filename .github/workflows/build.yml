name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore NexAlbum.slnx
      - name: Build (uyarılar hata sayılır)
        run: dotnet build NexAlbum.slnx -c Release --no-restore
      - name: Format kontrolü
        run: dotnet format NexAlbum.slnx --verify-no-changes --no-restore

name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: FFmpeg (hikâye filmi bütünleşme testi, Karar 21)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test + kapsam
        run: dotnet test NexAlbum.slnx -c Release --collect:"XPlat Code Coverage" --results-directory TestResults --logger "trx" --blame-hang-timeout 5m
      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-sonuclari-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
          retention-days: 14
      - name: Test özeti (0 test = hata)
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Recurse -Filter *.trx
          if (-not $trx) { Write-Output "::error::Test sonucu (.trx) bulunamadı"; exit 1 }
          $t = 0; $p = 0; $f = 0
          $ErrorActionPreference = 'Stop'
          foreach ($x in $trx) {
            try {
              $d = New-Object System.Xml.XmlDocument
              $d.Load($x.FullName)
              $c = $d.TestRun.ResultSummary.Counters
              $t += [int]$c.total; $p += [int]$c.passed; $f += [int]$c.failed
              foreach ($r in $d.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | Select-Object -First 10) {
                $m = ($r.Output.ErrorInfo.Message -replace '[\r\n]+', ' ')
                if ($m.Length -gt 400) { $m = $m.Substring(0, 400) }
                Write-Output "::error title=Basarisiz test::$($r.testName) :: $m"
              }
            } catch {
              $msg = ($_.Exception.Message -replace '[\r\n]', ' ')
              Write-Output "::error title=TRX okunamadi::$($x.Name): $msg"
              exit 1
            }
          }
          Write-Output "::notice title=Testler (${{ matrix.os }})::Toplam $t, gecen $p, basarisiz $f"
          # Takılan/çöken test: --blame dizisi son çalışan testleri yazar (dökümler büyük olduğundan yalnızca adlar).
          foreach ($seq in Get-ChildItem TestResults -Recurse -Filter 'Sequence_*.xml') {
            $q = New-Object System.Xml.XmlDocument
            $q.Load($seq.FullName)
            $names = @($q.TestSequence.Test | ForEach-Object { $_.Name })
            $last = ($names | Select-Object -Last 3) -join ' | '
            Write-Output "::error title=Takilan ya da coken test::$last"
          }
          # Her paket için en yüksek kapsam (birden çok test projesi aynı derlemeyi raporlayabilir).
          $best = @{}
          foreach ($cov in Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml) {
            $c = New-Object System.Xml.XmlDocument
            $c.Load($cov.FullName)
            foreach ($pkg in $c.coverage.packages.package) {
              $line = [double]$pkg.'line-rate'
              if (-not $best.ContainsKey($pkg.name) -or $best[$pkg.name][0] -lt $line) {
                $best[$pkg.name] = @($line, [double]$pkg.'branch-rate')
              }
            }
          }
          foreach ($name in ($best.Keys | Sort-Object)) {
            $l = [math]::Round($best[$name][0] * 100, 1); $b = [math]::Round($best[$name][1] * 100, 1)
            Write-Output "::notice title=Kapsam $name (${{ matrix.os }})::satir yuzde $l, dal yuzde $b"
          }
          if ($t -eq 0) { Write-Output "::error::Hic test calismadi"; exit 1 }

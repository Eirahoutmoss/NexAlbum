name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test + kapsam
        run: dotnet test NexAlbum.slnx -c Release --collect:"XPlat Code Coverage" --results-directory TestResults --logger "trx"
      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-sonuclari-${{ matrix.os }}
          path: TestResults/
          retention-days: 14
